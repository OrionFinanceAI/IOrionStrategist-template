name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Compile, type check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - run: npx tsc --noEmit
      - run: npm test

  trivy-fs:
    name: Trivy fs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy fs report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          trivyignores: .trivyignore.yaml

      - name: Trivy fs fail on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: table
          severity: CRITICAL
          exit-code: "1"
          skip-setup-trivy: true
          trivyignores: .trivyignore.yaml

  trivy-image:
    name: Trivy image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f infra/ecs/Dockerfile -t iorion-strategist-template:${{ github.sha }} .

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: iorion-strategist-template:${{ github.sha }}
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          trivyignores: .trivyignore.yaml

      - name: Trivy image fail on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: iorion-strategist-template:${{ github.sha }}
          ignore-unfixed: true
          format: table
          severity: CRITICAL
          exit-code: "1"
          skip-setup-trivy: true
          trivyignores: .trivyignore.yaml

